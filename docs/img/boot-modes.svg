<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" font-family="Helvetica,Arial,sans-serif">
  <rect width="660" height="250" fill="#ffffff"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F4E79">BOOT switch positions (set with the board powered OFF)</text>

  <!-- ================= SD CARD : 0 0 ================= -->
  <g transform="translate(30,50)">
    <rect x="0" y="0" width="180" height="130" rx="6" fill="#F4F7FA" stroke="#1F4E79" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">SD CARD</text>
    <text x="90" y="38" text-anchor="middle" font-size="11" fill="#5A6B7C">use this for the devkit</text>
    <!-- switch body -->
    <rect x="45" y="50" width="90" height="52" rx="3" fill="#2b2b2b"/>
    <text x="52" y="63" font-size="8" fill="#ffffff">ON</text>
    <!-- sliders: both DOWN (off / GND) -->
    <rect x="62" y="76" width="22" height="20" fill="#d9d9d9"/>
    <rect x="96" y="76" width="22" height="20" fill="#d9d9d9"/>
    <text x="73" y="98" text-anchor="middle" font-size="9" fill="#ffffff">1</text>
    <text x="107" y="98" text-anchor="middle" font-size="9" fill="#ffffff">2</text>
    <text x="90" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">0 0</text>
  </g>

  <!-- ================= QSPI : 1 0 ================= -->
  <g transform="translate(240,50)">
    <rect x="0" y="0" width="180" height="130" rx="6" fill="#FDF3E7" stroke="#E8A33D" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a12">QSPI FLASH</text>
    <text x="90" y="38" text-anchor="middle" font-size="11" fill="#8a5a12">factory default</text>
    <rect x="45" y="50" width="90" height="52" rx="3" fill="#2b2b2b"/>
    <text x="52" y="63" font-size="8" fill="#ffffff">ON</text>
    <!-- SW1 UP (on / 3V3), SW2 DOWN -->
    <rect x="62" y="56" width="22" height="20" fill="#ffffff"/>
    <rect x="96" y="76" width="22" height="20" fill="#d9d9d9"/>
    <text x="73" y="98" text-anchor="middle" font-size="9" fill="#ffffff">1</text>
    <text x="107" y="98" text-anchor="middle" font-size="9" fill="#ffffff">2</text>
    <text x="90" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a12">1 0</text>
  </g>

  <!-- ================= JTAG : 1 1 ================= -->
  <g transform="translate(450,50)">
    <rect x="0" y="0" width="180" height="130" rx="6" fill="#F4F7FA" stroke="#1F4E79" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">JTAG</text>
    <text x="90" y="38" text-anchor="middle" font-size="11" fill="#5A6B7C">debug / flashing</text>
    <rect x="45" y="50" width="90" height="52" rx="3" fill="#2b2b2b"/>
    <text x="52" y="63" font-size="8" fill="#ffffff">ON</text>
    <!-- both UP -->
    <rect x="62" y="56" width="22" height="20" fill="#ffffff"/>
    <rect x="96" y="56" width="22" height="20" fill="#ffffff"/>
    <text x="73" y="98" text-anchor="middle" font-size="9" fill="#ffffff">1</text>
    <text x="107" y="98" text-anchor="middle" font-size="9" fill="#ffffff">2</text>
    <text x="90" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">1 1</text>
  </g>

  <!-- legend -->
  <g transform="translate(30,196)">
    <rect x="0" y="0" width="18" height="14" fill="#ffffff" stroke="#2b2b2b"/>
    <text x="26" y="12" font-size="11" fill="#333">slider UP, toward "ON" = 1 = VCC3V3</text>
    <rect x="250" y="0" width="18" height="14" fill="#d9d9d9" stroke="#2b2b2b"/>
    <text x="276" y="12" font-size="11" fill="#333">slider DOWN = 0 = GND</text>
  </g>
  <text x="30" y="234" font-size="11" fill="#5A6B7C">The switch is marked BOOT, next to the RST button between the USB2.0 and DEBUG ports.</text>
</svg>
